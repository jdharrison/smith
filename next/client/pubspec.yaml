name: smith_client
description: Minimal Linux desktop shell for the Smith product reset.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/icons/
    - assets/README.md
    - assets/fonts/jetbrains-mono/OFL.txt
    - assets/fonts/ibm-plex-mono/OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-SemiBold.ttf
          weight: 600
