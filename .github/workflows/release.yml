name: Installer candidate

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

# Building a candidate is not permission to create or publish a GitHub Release.
# The caller must separately approve this tag push and its artifact disclosure.
jobs:
  installer:
    name: Verify and build tagged installer
    uses: ./.github/workflows/ci.yml
    with:
      release-candidate: true
