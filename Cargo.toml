[package]
name = "smith"
version = "0.4.0"
edition = "2021"
authors = ["Jacob D. Harrison"]
description = "smith — open-source control plane for local agent orchestration"
license = "MIT"
rust-version = "1.83"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
ctrlc = "3"
termimad = "0.35.1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
