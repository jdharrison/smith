[package]
name = "smith-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[workspace]
resolver = "2"
