# Operator-only packaging; do not start on the normal host during agent validation.
services:
  stt:
    build: .
    command: ["python", "serve.py", "stt"]
    ports:
      - "127.0.0.1:4890:4890"
    networks: [stt-private]
    volumes:
      - type: bind
        source: ${SMITH_STT_MODEL_DIR:?Set an existing narrow CTranslate2 model directory}
        target: /models/whisper
        read_only: true
        bind:
          create_host_path: false
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "stt"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 2
    logging:
      driver: "none"
  tts:
    build: .
    command: ["python", "serve.py", "tts"]
    ports:
      - "127.0.0.1:4891:4891"
    networks: [tts-private]
    volumes:
      - type: bind
        source: ${SMITH_TTS_MODEL_DIR:?Set an existing narrow Kokoro ONNX and voices directory}
        target: /models/kokoro
        read_only: true
        bind:
          create_host_path: false
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "tts"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 2
    logging:
      driver: "none"
networks:
  stt-private:
    internal: true
  tts-private:
    internal: true
